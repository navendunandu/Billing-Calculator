name: billing_app_pos
description: "A fast, offline-first store billing app with calculator-style UI for elder-friendly daily use."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^3.3.2
  
  # Database
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  
  # Navigation
  go_router: ^17.3.0
  
  # Export
  pdf: ^3.10.8
  printing: ^5.14.2
  excel: ^4.0.3
  path_provider: ^2.1.3
  share_plus: ^13.2.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.2.0
  audioplayers: ^6.1.0
  
  # Localization
  intl: ^0.20.2
  
  # Utils
  shared_preferences: ^2.2.3
  path: ^1.9.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
